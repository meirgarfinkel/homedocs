# Builds HomeDocs on GitHub's machines.
# - Linux: the AppImage is built in AlmaLinux 9 (glibc 2.34), then its self-test runs on a fresh
#   Debian, Ubuntu, Fedora and Arch. HomeDocs.deb is made from it, and installed and tested on Debian
#   and Ubuntu. This runs on every pull request (its two builds are required
#   checks for merging into main), so a change that breaks some distro shows up before it's merged.
# - Windows: the installer, built the same way on Windows; its self-test runs too.
# - Mac: HomeDocs.dmg, built on an Apple Silicon Mac; its self-test runs too.
#
# Releasing is automatic: when a merge into main has a version (homedocs/__init__.py) with no Release
# yet, all of it is built again from main and published as a GitHub Release tagged v<version>. Merges
# that don't change the version build nothing here (their pull request already did).
#
# A pull request's build saves nothing on GitHub: each job tests what it built itself. Only a release's
# build and one started by hand save their files: a release's for the Release, a hand-started one's to
# download.

name: Build HomeDocs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:  # a new push to a pull request replaces the build still running for the old one
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # (a release is never cut short)

jobs:
  version:
    # Is this a new version? (Only pushes to main can release.)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' homedocs/__init__.py)"
          [ -n "$version" ] || { echo "::error::No __version__ in homedocs/__init__.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release=true
            echo "::notice::Releasing v$version"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    needs: version
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/build_in_container.sh
      - name: Self-test on Debian, Ubuntu, Fedora and Arch
        run: |
          failed=""  # try every distro, so one failure doesn't hide another
          for distro in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04 fedora:latest archlinux:latest; do
            echo "::group::$distro"
            bash packaging/smoke_test.sh "$distro" HomeDocs-x86_64.AppImage || failed="$failed $distro"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::The self-test failed on:$failed"; exit 1; fi
      - run: bash packaging/build_deb.sh HomeDocs-x86_64.AppImage HomeDocs.deb
      - name: Install the .deb and self-test on Debian and Ubuntu
        run: |
          failed=""
          for distro in debian:12 ubuntu:22.04 ubuntu:24.04; do
            echo "::group::$distro"
            bash packaging/smoke_test.sh "$distro" HomeDocs.deb || failed="$failed $distro"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::The .deb failed on:$failed"; exit 1; fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: HomeDocs-Linux
          path: |
            HomeDocs-x86_64.AppImage
            HomeDocs.deb
          retention-days: 2
          if-no-files-found: error

  windows:
    needs: version
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: choco install innosetup --no-progress -y
      - run: packaging\build_windows.bat
        shell: cmd
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: HomeDocs-Windows
          path: HomeDocsSetup.exe
          retention-days: 2
          if-no-files-found: error

  mac:
    needs: version
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash packaging/build_mac.sh
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: HomeDocs-Mac
          path: HomeDocs.dmg
          retention-days: 2
          if-no-files-found: error

  release:
    # A new version: publish every build as a GitHub Release, tagging the commit they were built from.
    if: needs.version.outputs.release == 'true'
    needs: [version, linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: >
          gh release create "v${{ needs.version.outputs.version }}" --target "$GITHUB_SHA"
          --repo "$GITHUB_REPOSITORY" --generate-notes
          dist/HomeDocs-Linux/HomeDocs-x86_64.AppImage dist/HomeDocs-Linux/HomeDocs.deb
          dist/HomeDocs-Windows/HomeDocsSetup.exe dist/HomeDocs-Mac/HomeDocs.dmg
        env:
          GH_TOKEN: ${{ github.token }}

  cleanup:
    # A release's saved files were only for the Release, which keeps its own copies: delete them.
    if: always() && needs.version.outputs.release == 'true'
    needs: [version, linux, windows, mac, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
        env:
          GH_TOKEN: ${{ github.token }}
